<!DOCTYPE HTML>
{% load static %}
<html>
    <head>
        <title>{% block title %} | Company Zone{% endblock %}</title>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        
        {% block top_addtl_js_script %}{% endblock %}
        <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>

        <link href="{% static 'css/style.css' %}" rel="stylesheet">
        {% block internal_css %}{% endblock %}
    </head>
    <body>
        {% block main_body %}{% endblock %}
        <div id="black-fullscreen"></div>
        <script src="{% static 'js/common_script.js' %}"></script>
        {% block addtl_js_script %}{% endblock %}

        <template id="temp-imgvid">
            <div id="bfs-toolbar">
                <span id="media-head-title"></span>
                <div class="right-icons">
                    <button class="icon-btn css-icon close-btn" aria-label="Close" title="Close" onclick="close_fullscreen()"></button>
                </div>
            </div>
            <div id="bfs-viewport" onclick="close_fullscreen()"></div>
        </template>

                <span id="media-head-title"></span>

    </body>
</html>
